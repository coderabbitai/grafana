[[linters.exclusions.rules]]
linters = [
  'gosec'
]
path = '(.+)_test\.go'
text = 'G601'

[issues]
max-same-issues = 0

[formatters]
enable = [
  'goimports'
]

[formatters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$'
]
