[[linters.exclusions.rules]]
linters = [
  'staticcheck'
]
text = 'ST1000'

[[linters.exclusions.rules]]
linters = [
  'staticcheck'
]
text = 'ST1020'

[[linters.exclusions.rules]]
linters = [
  'staticcheck'
]
