name: Deploy Grafana Server Cloud Run on Dev

on:
  push:
    branches:
      - '**'
    paths:
      - "/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEV_IMAGE: gcr.io/coderabbit/grafana-base:latest
      DEV_WIF_PROVIDER: "projects/360385018187/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      DEV_WIF_SERVICE_ACCOUNT: "gha-dev-sa@coderabbit.iam.gserviceaccount.com"
      DEV2_IMAGE: gcr.io/coderabbitdev2/grafana-base:latest
      DEV2_WIF_PROVIDER: "projects/103024399030/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      DEV2_WIF_SERVICE_ACCOUNT: "gha-dev2-sa@coderabbitdev2.iam.gserviceaccount.com"
      DEV3_IMAGE: gcr.io/coderabbitdev3/grafana-base:latest
      DEV3_WIF_PROVIDER: "projects/135276041522/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      DEV3_WIF_SERVICE_ACCOUNT: "ga-dev3-sa@coderabbitdev3.iam.gserviceaccount.com"
      DEV4_IMAGE: gcr.io/coderabbitdev4/grafana-base:latest
      DEV4_WIF_PROVIDER: "projects/803057949155/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      DEV4_WIF_SERVICE_ACCOUNT: "gha-dev4-sa@coderabbitdev4.iam.gserviceaccount.com"
      QA_IMAGE: gcr.io/coderabbit-qa/grafana-base:latest
      QA_WIF_PROVIDER: "projects/573007642573/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      QA_WIF_SERVICE_ACCOUNT: "gha-qa-sa@coderabbit-qa.iam.gserviceaccount.com"
      STAGE_IMAGE: gcr.io/coderabbitstage/grafana-base:latest
      STAGE_WIF_PROVIDER: "projects/622905223913/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
      STAGE_WIF_SERVICE_ACCOUNT: "gha-stage-sa@coderabbitstage.iam.gserviceaccount.com"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      # - name: Cache Docker layers
      #   uses: actions/cache@v4
      #   with:
      #     path: /tmp/.buildx-cache
      #     key: ${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
      #     restore-keys: ${{ runner.os }}-${{ github.workflow }}-

      - name: Build image once
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: grafana:latest
          # cache-from: type=local,src=/tmp/.buildx-cache
          # cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Authenticate to Google Cloud (dev) with OIDC
        id: auth_dev
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (dev)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_dev.outputs.access_token }}

      - name: Push image to dev
        run: |
          docker tag grafana:latest "$DEV_IMAGE"
          docker push "$DEV_IMAGE"

      - name: Authenticate to Google Cloud (dev2) with OIDC
        id: auth_dev2
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.DEV2_WIF_PROVIDER }}
          service_account: ${{ env.DEV2_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (dev2)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_dev2.outputs.access_token }}

      - name: Push image to dev2
        run: |
          docker tag grafana:latest "$DEV2_IMAGE"
          docker push "$DEV2_IMAGE"

      - name: Authenticate to Google Cloud (dev3) with OIDC
        id: auth_dev3
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.DEV3_WIF_PROVIDER }}
          service_account: ${{ env.DEV3_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (dev3)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_dev3.outputs.access_token }}

      - name: Push image to dev3
        run: |
          docker tag grafana:latest "$DEV3_IMAGE"
          docker push "$DEV3_IMAGE"

      - name: Authenticate to Google Cloud (dev4) with OIDC
        id: auth_dev4
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.DEV4_WIF_PROVIDER }}
          service_account: ${{ env.DEV4_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (dev4)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_dev4.outputs.access_token }}

      - name: Push image to dev4
        run: |
          docker tag grafana:latest "$DEV4_IMAGE"
          docker push "$DEV4_IMAGE"

      - name: Authenticate to Google Cloud (qa) with OIDC
        id: auth_qa
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.QA_WIF_PROVIDER }}
          service_account: ${{ env.QA_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (qa)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_qa.outputs.access_token }}

      - name: Push image to qa
        run: |
          docker tag grafana:latest "$QA_IMAGE"
          docker push "$QA_IMAGE"

      - name: Authenticate to Google Cloud (staging) with OIDC
        id: auth_stage
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.STAGE_WIF_PROVIDER }}
          service_account: ${{ env.STAGE_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to GCR (staging)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth_stage.outputs.access_token }}

      - name: Push image to staging
        run: |
          docker tag grafana:latest "$STAGE_IMAGE"
          docker push "$STAGE_IMAGE"

      # - name: Move Docker cache
      #   run: |
      #     rm -rf /tmp/.buildx-cache
      #     mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # - name: Deploy to Cloud Run
      #   run: gcloud run deploy grafana --image gcr.io/coderabbit/grafana:latest --region us-central1 --allow-unauthenticated --vpc-connector=coderabbitai-dev-cr

      - name: Trigger a repository dispatch
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.PAT_TRIGGER_GRAFANA }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          https://api.github.com/repos/coderabbitai/mono/dispatches \
          -d "{\"event_type\": \"trigger-grafana-micro-frontend-dev\", \"client_payload\": {\"ref\": \"${GITHUB_REF}\"}}"
