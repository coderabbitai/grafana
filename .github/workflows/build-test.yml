name: Build and test

on:
  pull_request:
    branches: [coderabbit_micro_frontend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: grafana:pr-test
          cache-from: type=gha,scope=grafana-pr
          cache-to: type=gha,mode=max,scope=grafana-pr
      - name: Verify startup and database health
        run: |
          docker run -d --name grafana-pr-test -p 127.0.0.1:3000:3000 \
            -e GF_SERVER_HTTP_PORT=3000 \
            -e GF_ANALYTICS_REPORTING_ENABLED=false \
            -e GF_PLUGINS_PREINSTALL_DISABLED=true grafana:pr-test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health | jq -e '.database == "ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs grafana-pr-test
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs grafana-pr-test || true
      - name: Stop test container
        if: always()
        run: docker rm -f grafana-pr-test || true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test code generation and schema conversion
        run: go test ./pkg/codegen/... ./scripts/openapi3/...
